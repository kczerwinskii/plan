<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Pulpit trenera</title><meta name="theme-color" content="#0B0B0B">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* pulpit trenera (patch103, wariant B3 zaakceptowany przez Kubę 28.09) */
:root{--bg:#0B0B0B;--c1:#141414;--c2:#1A1A1A;--ln:#2C2C2C;--gl:#E6CB80;--gm:#C9A455;--gd:#8E6B2E;--iv:#F4F1EA;--ivd:#A7A49C}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--iv);font:14px Poppins,Arial,sans-serif;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;padding:14px 28px;border-bottom:1px solid #1F1F1F;position:sticky;top:0;background:#0B0B0B;z-index:5}
.top .t{font-size:12px;letter-spacing:3px;color:var(--gm);font-weight:700;text-transform:uppercase}.top .sp{flex:1}
.wrap{max-width:1180px;margin:0 auto;padding:22px 28px 60px}
.b{height:38px;padding:0 16px;border-radius:10px;border:1.5px solid var(--gm);background:#141414;color:var(--gl);font:700 13px Poppins,Arial,sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none}
.b.pr{background:linear-gradient(180deg,#E6CB80,#C9A455 55%,#8E6B2E);color:#0E0E12;border-color:#F5E3A6}
.b.gh{border-color:#343434;color:var(--ivd);background:transparent}
.b.ic{width:38px;padding:0;font-size:18px;letter-spacing:1px}
.b.sm{height:32px;padding:0 12px;font-size:12px;border-radius:9px}.b.sm.ic{width:32px;padding:0}
.b:disabled{opacity:.6;cursor:default}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.tab{padding:9px 16px;border-radius:12px;border:1.5px solid #2F2F2F;background:var(--c1);color:var(--ivd);font:700 13px Poppins,Arial,sans-serif;display:flex;align-items:center;gap:8px;cursor:pointer}
.tab b{font-size:12px;background:#262626;color:var(--iv);border-radius:999px;padding:1px 8px}
.tab.on{border-color:var(--gm);color:var(--gl);background:#17140C}.tab.on b{background:var(--gm);color:#0E0E12}
.lista{background:var(--c1);border:1px solid var(--ln);border-radius:16px;overflow:hidden}
.w{display:grid;grid-template-columns:6px minmax(0,1fr) 170px 170px 170px 180px;align-items:center;column-gap:14px;padding:14px 18px 14px 0;border-top:1px solid #222}
.lista > :first-child{border-top:none}
.w > *{text-align:center;min-width:0}.w > .kto{text-align:left}
.w.hd{padding-top:11px;padding-bottom:11px;background:#111;font-size:10px;letter-spacing:1.2px;text-transform:uppercase;color:var(--ivd);font-weight:700}
.kol{align-self:stretch;border-radius:0 4px 4px 0;min-height:40px}.kol.r{background:linear-gradient(180deg,#A63A4C,#6E2231)}.kol.n{background:linear-gradient(180deg,#4A62A0,#1E2A47)}.kol.g{background:linear-gradient(180deg,#E6CB80,#8E6B2E)}.kol.s{background:#3A3A3A}
.kto b{display:block;font-size:15px}.kto small{display:block;color:var(--ivd);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kto small.nt{color:#D9D3C4}.kto small.bk{color:var(--gl)}.kto small.bl{color:#E0798A}
.v b{display:block;font-size:15px}.v small{display:block;font-size:11px;color:var(--ivd);white-space:nowrap}.v b.zal{color:#E0798A}
/* patch113: kolumna i panel dostępu */.v b.kon{color:var(--gl)}.v b.bez{color:var(--ivd);font-weight:600;font-size:13px}
.pan.dp{background:#101010;border-top:1px solid #222;padding:16px 22px 18px 24px}.dst{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.dst .l{font-weight:700}
.dst input{width:90px;height:40px;border-radius:10px;border:1.5px solid var(--gm);background:#0B0B0B;color:var(--iv);font:700 17px Poppins,Arial,sans-serif;text-align:center;padding:0}
.dst .mut{font-size:13px}.dst .mut b{color:var(--iv)}.dst .b.bl{height:28px;padding:0 10px;font-size:11px;border-radius:8px}.dst-msg{font-size:12px;color:var(--gl);margin-top:10px}.dst-msg:empty{display:none}.dst-msg.err{color:#E0798A}
.wk{display:flex;gap:4px;justify-content:center;margin-top:5px}
.wk i{width:14px;height:14px;border-radius:4px;border:1.5px solid var(--gd);display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:9px;font-weight:800;color:#0E0E12}
.wk i.on{background:linear-gradient(180deg,#E6CB80,#C9A455 55%,#8E6B2E);border-color:#F5E3A6}
.akc{display:flex;gap:8px;justify-content:flex-end;align-items:center}
.nw{display:grid;grid-template-columns:6px minmax(0,1fr) auto auto;align-items:center;column-gap:14px;padding:14px 18px 14px 0;border-top:1px solid #222}
.pan{border-top:1px dashed #262626;padding:12px 18px 16px 24px}.pan:empty{display:none}
/* patch118: stan zgody na dane o zdrowiu przy imieniu */
.ki{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.zp{font-size:10px;font-weight:700;letter-spacing:.3px;padding:2px 9px;border-radius:999px;background:#262626;color:var(--ivd);white-space:nowrap}.zp.wyc{background:#2A1218;color:#E0798A;box-shadow:inset 0 0 0 1px #6E2231}
select{background:#101010;color:var(--iv);border:1.5px solid #333;border-radius:9px;padding:6px 8px;font:13px Poppins,Arial,sans-serif}
.pusto{padding:26px;text-align:center;color:var(--ivd)}
.dol{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-top:14px}
/* patch116: konta bez maila (panel „Nowy podopieczny”, ramka z loginem i hasłem, panel „Login i hasło”) */
/* patch117: konta bez planu (zarejestrowane same przed zmianą logowania) */
.bp{margin:22px 0 8px}.bp b{font-size:14px}.bp b span{color:var(--ivd);font-weight:600;margin-left:4px}.bp small{display:block;font-size:12px;color:var(--ivd);margin-top:3px}
.np{background:#141414;border:1px solid var(--ln);border-radius:14px;padding:16px 18px;margin-top:12px}.np h4{margin:0 0 12px;font-size:15px}
.pr2{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;align-items:start}.pr2.j{grid-template-columns:minmax(0,320px) auto;justify-content:start}
.pl label{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--ivd);font-weight:700;margin-bottom:6px}
.pl input{display:block;width:100%;height:42px;border-radius:10px;border:1.5px solid #3A3A3A;background:#0B0B0B;font-weight:600;padding:0 12px}
.pl small{display:block;font-size:11px;color:var(--ivd);margin-top:5px}.pr2 > .b{margin-top:21px;height:42px}
.np-msg{font-size:13px;color:#E0798A;margin-top:10px}.np-msg:empty{display:none}
.gotowe{margin-top:14px;border:1.5px solid var(--gd);background:#15130D;border-radius:14px;padding:14px 16px}.gotowe > b{color:var(--gl)}
.gotowe .dd{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:15px;margin:10px 0 12px;align-items:baseline}.gotowe > .dd:first-child{margin-top:0}
.gotowe .dd span{color:var(--ivd)}.gotowe .dd b{font-family:Consolas,Menlo,monospace;font-size:17px;letter-spacing:.5px;overflow-wrap:anywhere}.gotowe .dd b.ad{font-family:Poppins,Arial,sans-serif;font-size:14px;letter-spacing:0}
.gotowe .kd{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.gotowe .uw{font-size:12px;color:var(--ivd)}
.pan.kp{background:#101010;border-top:1px solid #222;padding:16px 22px 18px 24px}
.lh{display:flex;align-items:center;gap:14px;flex-wrap:wrap}.lh .l{color:var(--ivd)}.lh .lgv{font-family:Consolas,Menlo,monospace;font-size:17px;letter-spacing:.5px;overflow-wrap:anywhere}.lh .sp{flex:1}
.lh .lnk{background:none;border:0;padding:0;color:var(--gl);font:600 12px Poppins,Arial,sans-serif;text-decoration:underline;cursor:pointer}
.lh.zm{margin-top:12px}.lh.zm[hidden]{display:none}.lh.zm input{width:220px;height:40px;border-radius:10px;border:1.5px solid var(--gm);background:#0B0B0B;font-weight:600;padding:0 12px}
input{background:#101010;color:var(--iv);border:1.5px solid #333;border-radius:10px;padding:10px 12px;font:14px Poppins,Arial,sans-serif}input:focus,select:focus{outline:0;border-color:var(--gm)}
.mut{color:var(--ivd)}.err{color:#E0798A;font-size:13px;min-height:18px}
.pmenu{position:absolute;z-index:50;background:#161616;border:1px solid var(--gd);border-radius:12px;padding:6px;min-width:220px;box-shadow:0 12px 30px rgba(0,0,0,.6)}
.pmenu div{padding:10px 12px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer}.pmenu div:hover{background:#222}.pmenu .zak{color:#E0798A}
.login{min-height:70vh;display:flex;align-items:center;justify-content:center}
.login .card{width:min(420px,100%);background:var(--c1);border:1px solid var(--gd);border-radius:18px;padding:26px;display:flex;flex-direction:column;gap:12px}
.login h1{margin:0 0 4px;font-size:22px;color:var(--gl)}.login input{width:100%;font-size:16px}
@media (max-width:820px){.top{padding:12px 16px}.wrap{padding:16px}.w.hd{display:none}
 .w{grid-template-columns:6px 1fr 1fr;row-gap:12px;column-gap:12px;padding:14px 14px 14px 0}.w .kol{grid-row:span 4}.w .kto{grid-column:2 / 4}.w .akc{grid-column:2 / 4}.w .akc .pr{flex:1}
 .w .v{text-align:left}.w .v small{white-space:normal}.w .wk{justify-content:flex-start}.w .v::before{content:attr(data-l);display:block;font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--ivd);margin-bottom:2px}
 .w .v[data-l="Tydzień bloku"]{grid-column:2 / 4}
 .nw{grid-template-columns:6px 1fr;row-gap:10px;column-gap:12px;padding:14px 14px 14px 0}.nw .kol{grid-row:span 3}.nw .pill{justify-self:start}.nw .akc{justify-content:flex-start;flex-wrap:wrap}.nw .akc .pr{flex:1}
 .dol{flex-direction:column;align-items:stretch}
 .pr2,.pr2.j{grid-template-columns:1fr}.pr2 > .b{margin-top:0}.lh .sp{display:none}.lh.zm input{flex:1;width:auto;min-width:0}}
</style></head><body>
<div class="top"><span class="t">Pulpit trenera</span><span class="sp"></span><a class="b gh sm" id="doPlanu">‹ Do planu</a><button class="b gh sm" id="wyloguj" hidden>Wyloguj</button></div>
<div class="wrap" id="tresc"><div class="mut">Wczytuję…</div></div>
<script>var API_URL = "https://hnyfncbytkbufobyxeoh.supabase.co/functions/v1/api";</script>
<script>
var TSESJA = null; try { TSESJA = localStorage.getItem('trener_sesja'); localStorage.removeItem('trener_haslo'); } catch (e) {}
function api(b) { if (TSESJA && !b.sesja) b.sesja = TSESJA; return fetch(API_URL, { method: 'POST', body: JSON.stringify(b), redirect: 'follow' }).then(function (r) { return r.text(); }, function () { throw new Error('Brak połączenia z serwerem. Sprawdź internet i spróbuj ponownie.'); }).then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('Serwer odpowiedział nieprawidłowo, spróbuj za chwilę.'); } }).then(function (r) { if (!r.ok) throw new Error(r.error || 'Błąd serwera'); return r.dane; }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var BAZA = location.href.replace(/lista\.html.*$/, '');
document.getElementById('doPlanu').href = BAZA;
var T = document.getElementById('tresc'), KONTA = [], LISTA = [], ZAKL = 'wszyscy', MENU_EL = null;
try { ZAKL = localStorage.getItem('pulpit_zakl') || 'wszyscy'; } catch (e) {}

function pokazHaslo(msg) {
  document.getElementById('wyloguj').hidden = true;
  T.innerHTML = '<div class="login"><div class="card"><span class="mut" style="font-size:11px;letter-spacing:3px;text-transform:uppercase;color:var(--gm);font-weight:700">Pulpit trenera</span><h1>Zaloguj się</h1><input id="he" type="email" autocomplete="username" placeholder="e-mail"><input id="h" type="password" autocomplete="current-password" placeholder="hasło"><button class="b pr" id="hb">Wejdź</button><div class="err" id="hm">' + esc(msg || '') + '</div></div></div>';
  var go = function () {
    var em = document.getElementById('he').value.trim(), ha = document.getElementById('h').value; if (!em || !ha) return;
    document.getElementById('hb').textContent = 'Sprawdzam…';
    api({ akcja: 'logowanie', login: em, email: em, haslo: ha }).then(function (r) { if (r.rola !== 'trener') throw new Error('To nie jest konto trenera.'); TSESJA = r.sesja; try { localStorage.setItem('trener_sesja', TSESJA); } catch (e) {} wczytaj(); }).catch(function (e) { pokazHaslo(e.message); });
  };
  document.getElementById('hb').onclick = go; document.getElementById('h').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); }); document.getElementById('he').focus();
}
function wczytaj() {
  if (!TSESJA) return pokazHaslo();
  if (!LISTA.length && !KONTA.length) T.innerHTML = '<div class="mut">Wczytuję podopiecznych…</div>';
  Promise.all([api({ akcja: 'pulpit' }), api({ akcja: 'konta' })]).then(function (r) { LISTA = r[0] || []; KONTA = r[1] || []; document.getElementById('wyloguj').hidden = false; rysuj(); }).catch(function (e) { if (/hasło|dostęp|sesja/i.test(e.message)) { try { localStorage.removeItem('trener_sesja'); } catch (x) {} TSESJA = null; pokazHaslo(e.message); } else { T.innerHTML = '<span class="err">' + esc(e.message) + '</span> <button class="b gh sm" onclick="wczytaj()" style="margin-left:10px">Spróbuj ponownie</button>'; } });
}
function dni(iso) { if (!iso) return null; var d = new Date(String(iso).slice(0, 10)); if (isNaN(d)) return null; return Math.max(0, Math.floor((Date.now() - d.getTime()) / 86400000)); }
function dniTxt(n) { return n <= 0 ? 'dziś' : n === 1 ? '1 dzień temu' : n + ' dni temu'; }
function dataKr(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3] + '.' + m[2] : String(iso || ''); }
// patch113: dostęp na określoną liczbę dni. „Dziś” jak na serwerze: data w Europe/Warsaw; ostatni dzień dostępu = dostepDo włącznie.
function dzisW() { try { return new Intl.DateTimeFormat('sv-SE', { timeZone: 'Europe/Warsaw' }).format(new Date()); } catch (e) { var d = new Date(); return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); } }
function isoUTC(iso) { var m = String(iso || '').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? Date.UTC(+m[1], m[2] - 1, +m[3]) : null; }
function dniDostepu(iso) { var a = isoUTC(iso), b = isoUTC(dzisW()); return a == null || b == null ? null : Math.round((a - b) / 86400000); }
function dostepUwaga(k) { var d = dniDostepu(k.dostepDo); return d != null && d <= 7; }
function dataPelna(ms) { var d = new Date(ms); return ('0' + d.getUTCDate()).slice(-2) + '.' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '.' + d.getUTCFullYear(); }
function nowyKoniec(iso, dni) { var dz = isoUTC(dzisW()), ob = isoUTC(iso); return dataPelna(Math.max(dz, ob == null ? dz : ob) + dni * 86400000); }
function komDostep(k) {
  var d = dniDostepu(k.dostepDo);
  if (d == null) return '<b class="bez">bez limitu</b>';
  if (d < 0) return '<b class="zal">Wygasł</b><small>' + esc(dataKr(k.dostepDo)) + '</small>';
  return '<b' + (d <= 7 ? ' class="kon"' : '') + '>' + (d === 0 ? 'dzisiaj' : d === 1 ? '1 dzień' : d + ' dni') + '</b><small>do ' + esc(dataKr(k.dostepDo)) + '</small>';
}
function liczbaDni(v) { v = String(v || '').trim(); if (!/^\d{1,4}$/.test(v)) return null; var x = parseInt(v, 10); return x >= 1 && x <= 3650 ? x : null; }
function pokazDostep(b, msg, przelacz) {
  var out = document.getElementById('pan-' + b), k = LISTA.filter(function (x) { return x.bazaId === b; })[0]; if (!out || !k) return;
  if (przelacz && out.classList.contains('dp')) { out.classList.remove('dp'); out.innerHTML = ''; return; }
  document.querySelectorAll('.pan.dp').forEach(function (x) { if (x !== out) { x.classList.remove('dp'); x.innerHTML = ''; } }); // jeden panel dostępu naraz
  out.classList.remove('kp'); out.classList.add('dp');
  out.innerHTML = '<div class="dst"><span class="l">Dodaj dni dostępu</span><input id="dst-dni" inputmode="numeric" maxlength="4" value="30" aria-label="Liczba dni"><button class="b pr sm" id="dst-zap">Zapisz</button>'
    + '<span class="mut">Nowy koniec: <b id="dst-kon"></b> (liczone od obecnego końca, a gdy już wygasł, od dziś)</span>'
    + (k.dostepDo ? '<button class="b gh bl" id="dst-bez">Bez limitu</button>' : '') + '</div><div class="dst-msg" id="dst-msg"></div>';
  var q = function (id) { return out.querySelector('#' + id); }, inp = q('dst-dni'), kon = q('dst-kon'), zap = q('dst-zap'), m = q('dst-msg');
  var licz = function () { var d = liczbaDni(inp.value); kon.textContent = d ? nowyKoniec(k.dostepDo, d) : '–'; zap.disabled = !d; };
  var info = function (t, err) { m.textContent = t; m.classList.toggle('err', !!err); };
  inp.addEventListener('input', licz); inp.addEventListener('keydown', function (e) { if (e.key === 'Enter' && !zap.disabled) zap.click(); }); licz();
  if (msg) info(msg);
  zap.onclick = function () {
    var d = liczbaDni(inp.value); if (!d) { info('Podaj liczbę dni od 1 do 3650.', true); return; }
    zap.disabled = true; zap.textContent = 'Zapisuję…';
    api({ akcja: 'dostepDodaj', bazaId: b, dni: d }).then(function (r) { k.dostepDo = r && r.dostepDo || k.dostepDo; rysuj(); pokazDostep(b, 'Zapisano. Dostęp do ' + dataPelna(isoUTC(k.dostepDo)) + '.'); })
      .catch(function (e) { zap.disabled = false; zap.textContent = 'Zapisz'; info(e.message, true); });
  };
  var bez = q('dst-bez');
  if (bez) bez.onclick = function () {
    bez.disabled = true;
    api({ akcja: 'dostepUsun', bazaId: b }).then(function () { k.dostepDo = ''; rysuj(); pokazDostep(b, 'Zapisano. Dostęp bez limitu.'); })
      .catch(function (e) { bez.disabled = false; info(e.message, true); });
  };
  inp.focus(); inp.select();
}
// patch116: konta bez maila. Identyfikator konta to login (serwer zwraca login, a email zostaje dla zgodności).
var ADRES = 'https://kczerwinskii.github.io/plan/', LOGIN_RE = /^[a-z0-9][a-z0-9._-]{2,29}$/;
var TXT_LOGIN = 'Login: 3 do 30 znaków, małe litery, cyfry, kropka, myślnik albo podkreślenie.';
var TXT_RAZ = 'Hasło widać tylko teraz. Potem można nadać nowe.';
function lg(k) { return k ? String(k.login || k.email || '') : ''; }
// patch122: pole loginu pokazuje od razu to, co zapisze serwer (małe litery, bez spacji na brzegach); kursor zostaje na miejscu
function loginNaZywo(el) {
  var v = el.value, p = el.selectionStart == null ? v.length : el.selectionStart;
  var n = v.toLowerCase().replace(/^\s+|\s+$/g, ''); if (n === v) return;
  var przed = v.slice(0, p).toLowerCase().replace(/^\s+/, '').length; el.value = n;
  try { var k = Math.max(0, Math.min(n.length, przed)); el.setSelectionRange(k, k); } catch (e) {}
}
function bezMaila(v) { v = String(v || ''); return v.indexOf('@') < 0 ? v : ''; }
function los3() { var n; try { var a = new Uint32Array(1); crypto.getRandomValues(a); n = a[0] % 900; } catch (e) { n = Math.floor(Math.random() * 900); } return String(100 + n); }
// podpowiedź loginu: pierwsze słowo imienia, małe litery, bez polskich znaków, + 3 losowe cyfry
function loginZImienia(imie, cyfry) {
  var s = String(imie || '').trim().split(/\s+/)[0].toLowerCase().replace(/ł/g, 'l');
  try { s = s.normalize('NFD').replace(/[̀-ͯ]/g, ''); } catch (e) {}
  s = s.replace(/[^a-z0-9]/g, '').slice(0, 27);
  return (s || 'osoba') + cyfry;
}
function wiadomosc(login, haslo) { return 'Twój plan treningowy:\n' + ADRES + '\nLogin: ' + login + '\nHasło: ' + haslo; }
function kopiuj(tekst, btn) {
  var ok = function () { btn.textContent = 'Skopiowano'; setTimeout(function () { btn.textContent = 'Kopiuj dane do wysłania'; }, 2000); };
  var zapas = function () { var ta = document.createElement('textarea'), u = false; ta.value = tekst; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); try { u = document.execCommand('copy'); } catch (e) {} ta.remove(); if (u) ok(); else prompt('Skopiuj dane i wyślij:', tekst); };
  try { navigator.clipboard.writeText(tekst).then(ok, zapas); } catch (e) { zapas(); }
}
