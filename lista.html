<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Podopieczni</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:linear-gradient(180deg,#2A2A36,#1B1B22 60%,#0E0E12) fixed;color:#EFE9DA;font:14px Poppins,Arial,sans-serif;min-height:100vh;padding:40px 20px;box-sizing:border-box}
.box{max-width:820px;margin:0 auto;background:#232330;border:1px solid #C9A455;border-radius:8px;padding:24px}
h1{color:#E6CB80;font-size:22px;margin:0 0 6px}
table{border-collapse:collapse;width:100%;margin-top:14px}th{color:#E6CB80;text-align:left;font-size:11px;letter-spacing:.5px;text-transform:uppercase;padding:8px;border-bottom:2px solid #C9A455}td{padding:8px;border-bottom:1px solid #4A4A5A;vertical-align:top}
a{color:#E6CB80}input{background:#1A1A24;color:#EFE9DA;border:1px solid #4A4A5A;border-radius:6px;padding:8px 10px;font:14px Poppins}
button{background:linear-gradient(180deg,#E6CB80,#C9A455 55%,#8E6B2E);color:#0E0E12;border:1px solid #F5E3A6;border-radius:6px;padding:8px 16px;font:600 14px Poppins;cursor:pointer}
button.szary{background:#1A1A24;color:#EFE9DA;border:1px solid #4A4A5A}.mut{color:#B9AE94;font-size:13px}.pin{font:800 20px Poppins;color:#E6CB80}
.box{max-width:1100px}
.pk{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px;margin-top:14px}
.k{background:linear-gradient(180deg,#2A2A36,#1B1B22);border:1px solid #C9A455;border-radius:8px;padding:14px 16px;position:relative}.k h2{margin:0 0 2px;font-size:18px;color:#fff}.k h2 small{display:block;font-size:12px;color:#B9AE94;font-weight:400}.k .cel{font-size:13px;color:#E6CB80;margin:6px 0 10px;min-height:18px}
.k .st{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}.k .st div{background:#14141C;border:1px solid #4A4A5A;border-radius:6px;padding:8px 6px;text-align:center}.k .st b{display:block;font-size:18px;color:#E6CB80}.k .st span{font-size:10px;letter-spacing:.5px;text-transform:uppercase;color:#B9AE94}
.k .bd{position:absolute;top:12px;right:12px;font-size:11px;font-weight:700;padding:3px 10px;border-radius:10px;border:1px solid rgba(255,255,255,.3)}.bd.ok{background:linear-gradient(180deg,#2E3F66,#161F36);color:#fff}.bd.al{background:linear-gradient(180deg,#8E3140,#6E2231 60%,#4A1520);color:#fff}.bd.new{background:linear-gradient(180deg,#E6CB80,#C9A455 55%,#8E6B2E);color:#0E0E12}
.k .ln{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}.k .ln a,.k .ln button{font-size:12px;padding:5px 10px}.k .ln .pin{font-size:16px}.k .wk{display:flex;gap:3px;margin-top:6px}.k .wk i{width:14px;height:14px;border:1px solid #C9A455;border-radius:3px;background:#1E1E28;display:inline-block}.k .wk i.on{background:linear-gradient(180deg,#E6CB80,#C9A455 55%,#8E6B2E)}
.k .ws{font-size:12px;color:#B9AE94;margin-top:8px;line-height:1.5}.k .ws b{color:#EFE9DA}.k .ws .warn{color:#E0684A;font-weight:700}
.dod{margin-top:22px;border-top:1px solid #4A4A5A;padding-top:14px}
.ankv{margin-top:10px;color:#EFE9DA;font-size:13px;columns:2;column-gap:24px}.ankq{break-inside:avoid;margin:0 0 10px;padding:8px 10px;background:#1A1A24;border-left:2px solid #8E6B2E;border-radius:4px}.ankq span{display:block;color:#B9AE94;font-size:11px;line-height:1.3}.ankq b{display:block;font-weight:500;white-space:pre-wrap;margin-top:3px}
</style></head><body><div class="box" id="box"><h1>Podopieczni</h1><div id="tresc" class="mut">Wczytuję…</div></div>
<script>var API_URL = "https://script.google.com/macros/s/AKfycbz48qRxFlyvGcVBSltMbjR8kfuQNCbq-8a5g2gYG7oJgtWiU2ZJ-HLEyux6WGc_Xesq1Q/exec";</script>
<script>
var HASLO = null; try { HASLO = localStorage.getItem('trener_haslo'); } catch (e) {}
function api(b) { if (HASLO) b.haslo = HASLO; return fetch(API_URL, { method: 'POST', body: JSON.stringify(b), redirect: 'follow' }).then(function (r) { return r.text(); }, function () { throw new Error('Brak połączenia z serwerem. Sprawdź internet i spróbuj ponownie.'); }).then(function (t) { try { return JSON.parse(t); } catch (e) { throw new Error('Serwer odpowiedział nieprawidłowo, spróbuj za chwilę.'); } }).then(function (r) { if (!r.ok) throw new Error(r.error || 'Błąd serwera'); return r.dane; }); }
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var BAZA = location.href.replace(/lista\.html.*$/, '');
function pokazHaslo(msg) {
  document.getElementById('tresc').innerHTML = '<p>Wpisz hasło trenera.</p><input id="h" type="password" style="font-size:18px"> <button id="hb">Wejdź</button><div id="hm" style="color:#E0684A;margin-top:8px">' + esc(msg || '') + '</div>';
  var go = function () { HASLO = document.getElementById('h').value.trim(); if (HASLO) wczytaj(); };
  document.getElementById('hb').onclick = go; document.getElementById('h').addEventListener('keydown', function (e) { if (e.key === 'Enter') go(); }); document.getElementById('h').focus();
}
function wczytaj() {
  if (!HASLO) return pokazHaslo();
  document.getElementById('tresc').textContent = 'Wczytuję podopiecznych…';
  Promise.all([api({ akcja: 'pulpit' }), api({ akcja: 'konta' }).catch(function () { return []; })]).then(function (r) { try { localStorage.setItem('trener_haslo', HASLO); } catch (e) {} KONTA = r[1] || []; LISTA = r[0]; rysuj(r[0]); }).catch(function (e) { if (/hasło/i.test(e.message)) { try { localStorage.removeItem('trener_haslo'); } catch (x) {} HASLO = null; pokazHaslo(e.message); } else { document.getElementById('tresc').innerHTML = '<span style="color:#E0684A">' + String(e.message).replace(/[<>&]/g, '') + '</span> <button class="btn" onclick="wczytaj()" style="margin-left:10px">Spróbuj ponownie</button>'; } });
}
function dni(iso) { if (!iso) return null; var d = new Date(String(iso).slice(0, 10)); if (isNaN(d)) return null; return Math.floor((Date.now() - d.getTime()) / 86400000); }
function fmt(v) { return v === '' || v == null ? '–' : String(v).replace('.', ','); }
var KONTA = [], LISTA = [];
function statusKonta(s) { return s === 'ankieta' ? '<span class="bd al" style="position:static">nowe konto · bez ankiety</span>' : s === 'czeka' ? '<span class="bd new" style="position:static">ankieta wypełniona · czeka na zatwierdzenie</span>' : s === 'odrzucone' ? '<span class="bd" style="position:static;background:#333">odrzucone</span>' : '<span class="bd ok" style="position:static">aktywne</span>'; }
function kontaHtml() {
  var nowe = KONTA.filter(function (k) { return k.status !== 'aktywne'; }), akt = KONTA.filter(function (k) { return k.status === 'aktywne'; });
  var h = '<div class="dod"><h1 style="font-size:16px">Konta podopiecznych' + (nowe.length ? ' <span class="bd new" style="position:static;margin-left:8px">' + nowe.length + ' do zatwierdzenia</span>' : '') + '</h1>';
  if (!KONTA.length) h += '<div class="mut">Nikt jeszcze nie założył konta. Podopieczny zakłada je sam na stronie planu (przycisk „Załóż konto”).</div>';
  var sel = '<select class="przyp-sel">' + LISTA.map(function (p) { return '<option value="' + esc(p.bazaId) + '">' + esc(p.imie) + '</option>'; }).join('') + '</select>';
  nowe.forEach(function (k) {
    h += '<div class="k" style="margin-top:10px"><h2>' + esc(k.imie) + '<small>' + esc(k.email) + ' · konto z ' + esc(k.utworzono) + '</small></h2><div style="margin:6px 0">' + statusKonta(k.status) + '</div>';
    if (k.status !== 'odrzucone') h += '<div class="ln"><button class="zatw" data-e="' + esc(k.email) + '" title="Tworzy pustą bazę planu i włącza konto">zatwierdź: nowa baza</button>' + (LISTA.length ? '<span class="mut">albo przypnij do istniejącej:</span>' + sel + '<button class="szary przyp" data-e="' + esc(k.email) + '">przypnij</button>' : '') + (k.ankieta ? '<button class="szary ank" data-e="' + esc(k.email) + '">pokaż ankietę</button>' : '') + '<button class="szary reset" data-e="' + esc(k.email) + '">nowe hasło</button><button class="szary odrz" data-e="' + esc(k.email) + '">odrzuć</button></div>';
    else h += '<div class="ln"><button class="szary zatw" data-e="' + esc(k.email) + '">przywróć i zatwierdź</button></div>';
    h += '<div class="mut ank-out" data-e="' + esc(k.email) + '"></div></div>';
  });
  if (akt.length) h += '<div class="mut" style="margin-top:12px">Aktywne konta (' + akt.length + '): ' + akt.map(function (k) { return esc(k.imie) + ' <span style="opacity:.7">(' + esc(k.email) + ')</span> <button class="szary reset" data-e="' + esc(k.email) + '" style="font-size:11px;padding:2px 8px">nowe hasło</button>' + (k.ankieta ? ' <button class="szary ank" data-e="' + esc(k.email) + '" style="font-size:11px;padding:2px 8px">ankieta</button><div class="ank-out" data-e="' + esc(k.email) + '"></div>' : ''); }).join('<br>') + '</div>';
  return h + '</div>';
}
function rysuj(lista) {
  var h = '<div class="mut">Pulpit: jeden rzut oka, kto zalega. Czerwona plakietka = od ponad 8 dni bez ważenia i bez raportu, albo raport czeka na odpowiedź. <a href="' + esc(BAZA) + '">← do planu</a></div><div class="pk">';
  lista.forEach(function (k) {
    var link = BAZA + '?k=' + k.token, dw = dni(k.wagaData), dr = dni(k.raportOst);
    var ostatni = Math.min(dw == null ? 999 : dw, dr == null ? 999 : dr);
    var zalega = ostatni > 8, bezOdp = (k.raportBezOdp || 0) > 0;
    var badge = k.blad ? '<span class="bd al">błąd bazy</span>' : bezOdp ? '<span class="bd new">raport czeka na odpowiedź</span>' : zalega ? '<span class="bd al">' + (ostatni === 999 ? 'brak wpisów' : ostatni + ' dni bez wpisu') + '</span>' : '<span class="bd ok">aktywny</span>';
    var blok = parseInt(k.blok, 10) || 0, zal = parseInt(k.zaliczone, 10) || 0, wk = ''; for (var i = 0; i < blok; i++) wk += '<i class="' + (i < zal ? 'on' : '') + '"></i>';
    var dwaga = (k.waga !== '' && k.wagaStart !== '' && k.waga != null) ? (parseFloat(k.waga) - parseFloat(k.wagaStart)) : null;
    h += '<div class="k">' + badge + '<h2>' + esc(k.imie) + '<small>' + esc(k.email) + (k.klub ? ' · ' + esc(k.klub) : '') + '</small></h2><div class="cel">' + (k.cel ? 'Cel: ' + esc(k.cel) : '<span class="mut">bez celu</span>') + '</div>';
    h += '<div class="st"><div><b>' + (blok ? zal + ' / ' + blok : '–') + '</b><span>tydzień bloku</span></div><div><b>' + fmt(k.waga) + (k.waga !== '' && k.waga != null ? ' kg' : '') + '</b><span>waga' + (dwaga != null && dwaga !== 0 ? ' (' + (dwaga > 0 ? '+' : '') + fmt(dwaga.toFixed(1)) + ')' : '') + '</span></div><div><b>' + (k.cwPlan ? k.cwWpisane + ' / ' + k.cwPlan : '–') + '</b><span>ćw. wpisane</span></div></div>';
    if (blok) h += '<div class="wk">' + wk + '</div>';
    h += '<div class="ws">ostatnie ważenie: <b>' + (k.wagaData ? esc(k.wagaData) + ' (' + dw + ' dni)' : '<span class="warn">brak</span>') + '</b><br>ostatni raport: <b>' + (k.raportOst ? 'tydz. ' + esc(k.raportTyg) + ' · ' + esc(String(k.raportOst).slice(0, 10)) + (bezOdp ? ' <span class="warn">· bez odpowiedzi</span>' : '') : '<span class="warn">brak</span>') + '</b>' + (k.hist ? '<br>zamknięte bloki: <b>' + k.hist + '</b>' : '') + '</div>';
    h += '<div class="ln"><a href="' + esc(BAZA) + '?klient=' + esc(k.bazaId) + '"><button>otwórz plan →</button></a><span class="pin" title="PIN podopiecznego">PIN ' + esc(k.pin) + '</span><button class="szary kop" data-l="' + esc(link) + '">kopiuj link</button><button class="szary kop2" data-l="' + esc(link) + '" data-p="' + esc(k.pin) + '" data-i="' + esc(String(k.imie || '').split(' ')[0]) + '">kopiuj wiadomość</button><button class="szary nowy" data-b="' + esc(k.bazaId) + '">nowy link</button></div></div>';
  });
  h += '</div>' + kontaHtml() + '<div class="dod"><h1 style="font-size:16px">Dodaj podopiecznego</h1><div style="display:flex;gap:8px;flex-wrap:wrap"><input id="imie" placeholder="Imię i nazwisko"><input id="mail" placeholder="e-mail (tylko dla Ciebie)"><button id="dodaj">Dodaj i utwórz bazę</button></div><div class="mut" style="margin-top:8px">Nowa baza to pusty plan z 16 partiami. Podopieczny wchodzi linkiem i PIN-em albo zakłada konto na stronie planu, a Ty przypinasz je do tej bazy w sekcji „Konta podopiecznych”.</div><div id="msg" class="mut" style="margin-top:8px"></div><div class="mut" style="margin-top:18px"><a href="#" id="wyloguj">wyloguj trenera na tym urządzeniu</a></div></div>';
  var t = document.getElementById('tresc'); t.innerHTML = h;
  t.addEventListener('click', function (e) {
    var b = e.target;
    if (b.classList.contains('kop')) { navigator.clipboard.writeText(b.dataset.l); b.textContent = 'skopiowano'; }
    if (b.classList.contains('kop2')) { var txt = 'Cześć' + (b.dataset.i ? ' ' + b.dataset.i : '') + '! Tu jest Twój plan treningowy:\n' + b.dataset.l + '\nPIN: ' + b.dataset.p + '\nOtwórz link w Safari lub Chrome, wpisz PIN raz, telefon go zapamięta. Potem możesz dodać stronę do ekranu głównego, żeby mieć ją pod ikonką.'; navigator.clipboard.writeText(txt); b.textContent = 'skopiowano'; }
    if (b.classList.contains('nowy')) { if (confirm('Stary link i PIN przestaną działać. Wygenerować nowe?')) api({ akcja: 'nowyLink', bazaId: b.dataset.b }).then(wczytaj).catch(function (er) { alert(er.message); }); }
    if (b.classList.contains('zatw')) { if (confirm('Zatwierdzić konto i utworzyć nową bazę planu?')) { b.textContent = 'tworzę…'; api({ akcja: 'zatwierdz', email: b.dataset.e }).then(wczytaj).catch(function (er) { alert(er.message); wczytaj(); }); } }
    if (b.classList.contains('przyp')) { var s = b.parentElement.querySelector('.przyp-sel'); if (s && confirm('Przypiąć konto do bazy „' + s.options[s.selectedIndex].text + '”?')) { api({ akcja: 'zatwierdz', email: b.dataset.e, bazaId: s.value }).then(wczytaj).catch(function (er) { alert(er.message); }); } }
    if (b.classList.contains('odrz')) { if (confirm('Odrzucić to konto? Osoba nie zaloguje się.')) api({ akcja: 'odrzuc', email: b.dataset.e }).then(wczytaj).catch(function (er) { alert(er.message); }); }
    if (b.classList.contains('reset')) { if (confirm('Ustawić nowe hasło? Stare przestanie działać, a osoba zostanie wylogowana.')) api({ akcja: 'resetHasla', email: b.dataset.e }).then(function (r) { prompt('Nowe hasło (skopiuj i wyślij podopiecznemu):', r.haslo); }).catch(function (er) { alert(er.message); }); }
    if (b.classList.contains('ank')) { api({ akcja: 'ankieta', email: b.dataset.e }).then(function (r) { var out = document.querySelector('.ank-out[data-e="' + b.dataset.e + '"]'); if (!out) return; var o = r.odpowiedzi || {}; var ks = Object.keys(o); out.innerHTML = ks.length ? '<div class="ankv">' + (r.data ? '<div class="mut" style="margin-bottom:8px">wypełniona ' + esc(r.data) + '</div>' : '') + ks.map(function (q) { var it = o[q]; var pyt = it && typeof it === 'object' ? it.p : q, odp = it && typeof it === 'object' ? it.o : (typeof it === 'object' ? JSON.stringify(it) : String(it)); return '<div class="ankq"><span>' + esc(pyt) + '</span><b>' + esc(odp) + '</b></div>'; }).join('') + '</div>' : 'Ankieta pusta.'; }).catch(function (er) { alert(er.message); }); }
    if (b.id === 'wyloguj') { e.preventDefault(); try { localStorage.removeItem('trener_haslo'); } catch (x) {} HASLO = null; pokazHaslo(); }
  });
  document.getElementById('dodaj').onclick = function () {
    var i = document.getElementById('imie').value.trim(), m = document.getElementById('mail').value.trim();
    if (!i || !m) { alert('Wpisz imię i e-mail'); return; }
    document.getElementById('msg').textContent = 'Tworzę bazę…';
    api({ akcja: 'dodaj', email: m, imie: i }).then(function (id) { location.href = BAZA + '?klient=' + id; }).catch(function (er) { document.getElementById('msg').textContent = 'Błąd: ' + er.message; });
  };
}
wczytaj();
</script></body></html>
