    if (/sesja|zaloguj|hasło/i.test(msg)) { wylogujKonto(true); ekranLogowania(msg); return; }
    var c = null; try { c = JSON.parse(localStorage.getItem('cache_sesja') || 'null'); } catch (x) {}
    if (c && c.d) { AUTH = { sesja: SESJA }; D = c.d; D.url = URL_STRONY; TR = false; render(); status('Brak sieci. Pokazuję plan z ' + new Date(c.t).toLocaleString('pl-PL', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) + '. Wpisy zapiszę, gdy wróci internet.', false, true); }
    else ekranLogowania(msg);
  });
}
function wylogujKonto(cicho) {
  var s = SESJA; SESJA = null; AUTH = null; MENU = false;
  try { localStorage.removeItem('sesja'); localStorage.removeItem('cache_sesja'); } catch (e) {}
  if (s && !cicho) api({ akcja: 'wyloguj', sesja: s }).catch(function () {});
  if (!cicho) ekranLogowania();
}
(function start() {
  var q = new URLSearchParams(location.search), k = q.get('k');
  try { HASLO = localStorage.getItem('trener_haslo'); } catch (e) {}
  if (k) { history.replaceState(null, '', location.pathname + location.hash); if (!HASLO && !SESJA) { ekranLogowania('Linki z PIN-em już nie działają. Zaloguj się kontem albo załóż je poniżej.'); return; } }
  if (HASLO) { ladowanie('Wczytuję…'); wczytajTrenera(); return; }
  if (SESJA) { ladowanie('Wczytuję Twój plan…'); wczytajSesja(); return; }
  if (q.get('klient') != null || q.get('trener') != null) hasloScreen(); else ekranLogowania();
})();
