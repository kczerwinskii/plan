  box.innerHTML = out;
  box.querySelectorAll('[data-id] [data-f]').forEach(function (el) { var id = el.closest('[data-id]').dataset.id; var o = D.cwiczenia.filter(function (c) { return c.id === id; })[0]; var tab = 'Cwiczenia'; if (!o) { o = D.wazenia.filter(function (c) { return c.id === id; })[0]; tab = 'Wazenia'; } if (o) bind(el, o, el.dataset.f, tab, { change: el.type === 'date', after: tab === 'Wazenia' ? function () { updateKpi(); } : null }); });
  var sel = document.getElementById('mobSel'); if (sel) sel.onchange = function () { mobT = n(sel.value); renderMob(); };
}
function updateKpi() { render(); }
function bindAll() {
  document.querySelectorAll('.desk tr[data-id] [data-f]').forEach(function (el) {

    var after = null;
    if (tab === 'Cwiczenia' && (el.dataset.f === 'typ' || el.dataset.f === 'sets')) after = function () { render(); };
    if (tab === 'Wazenia' && (el.dataset.f === 'waga' || el.dataset.f === 'data')) after = function () { clearTimeout(window._kt); window._kt = setTimeout(render, 900); };

  });
  document.querySelectorAll('.tile [data-f]').forEach(function (el) { var name = el.closest('.tile').dataset.p; var o = D.partie.filter(function (p) { return p.partia === name; })[0]; if (o) bind(el, o, el.dataset.f, 'Partie', { after: function () { clearTimeout(window._pt); window._pt = setTimeout(render, 900); } }); });
  document.querySelectorAll('.wk').forEach(function (el) { el.onclick = function () { var i = n(el.dataset.i); var z = n(U('zaliczone')); var nz = i < z ? i : i + 1; D.ustawienia.zaliczone = nz; push({ tab: 'Ustawienia', klucz: 'zaliczone', wartosc: nz }); render(); }; });
  var cel = document.getElementById('cel'); if (cel) bind(cel, D.ustawienia, 'cel', 'Ustawienia');
  var blok = document.getElementById('blok'); if (blok) bind(blok, D.ustawienia, 'blok', 'Ustawienia', { change: true, after: render });
  var kcal = document.getElementById('kcal'); if (kcal) bind(kcal, D.ustawienia, 'kcal', 'Ustawienia');
  var sk = document.getElementById('selK'); if (sk) sk.onchange = function () { location.href = D.url + '?klient=' + sk.value; };
}
function tog(k, i) { if (i == null) open[k] = !open[k]; else open[k][i] = !(open[k][i] == null ? (k === 't' && i === 1) : open[k][i]); render(); }
function dodajWaz() { var d = new Date(); var iso = d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2); var tmp = 'tmp' + Date.now(); var w = { id: tmp, data: iso, waga: '', kcal: U('kcal'), wegle: '', bialko: '', tluszcze: '', sol: '2–5 g', notatka: '' }; D.wazenia.push(w); push({ tab: 'Wazenia', id: 'nowe', tmp: tmp, dane: w }); open.waz = true; render(); setTimeout(function () { var el = document.querySelector('[data-id="' + tmp + '"] [data-f="waga"]'); if (el) el.focus(); }, 50); }

function pinScreen(msg) {

  document.getElementById('app').innerHTML = '<div style="max-width:760px;margin:120px auto;padding:0 16px"><div class="card" style="padding:44px;border-radius:12px"><div class="sub" style="font-size:20px">Plan treningowy</div><h1 style="margin:8px 0 22px;font-size:44px">Panel trenera</h1><p style="color:var(--ivd);margin:0 0 24px;font-size:24px">Wpisz hasło trenera. Przeglądarka je zapamięta.</p><input id="haslo" type="password" autocomplete="current-password" style="width:100%;height:100px;font:800 40px Poppins;text-align:center;background:#1A1A24;color:var(--gl);border:2px solid var(--gm);border-radius:8px"><button class="btn" id="haslobtn" style="width:100%;margin-top:24px;height:84px;font-size:30px">Wejdź</button><div id="haslomsg" style="color:var(--red);min-height:32px;margin-top:16px;font-weight:600;font-size:22px">' + (msg || '') + '</div><p style="color:var(--ivd);font-size:20px;margin-top:20px">Podopieczna? Wejdź swoim linkiem od Kuby (kończy się na ?k=…).</p></div></div>';

function wczytajTrenera() {
  var q = new URLSearchParams(location.search);

(function start() {
  var q = new URLSearchParams(location.search), k = q.get('k');

    try { HASLO = localStorage.getItem('trener_haslo'); } catch (e) {}

  }
})();
